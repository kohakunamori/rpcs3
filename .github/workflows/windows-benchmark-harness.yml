name: Windows benchmark harness

on:
  push:
    branches:
      - codex/windows-performance-benchmarks
    paths:
      - "scripts/benchmark_compare.ps1"
      - ".github/workflows/windows-benchmark-harness.yml"
  pull_request:
    paths:
      - "scripts/benchmark_compare.ps1"
      - ".github/workflows/windows-benchmark-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run benchmark harness against a deterministic no-op workload
        shell: pwsh
        run: |
          .\scripts\benchmark_compare.ps1 `
            -BaselineExecutable "$env:ComSpec" `
            -CandidateExecutable "$env:ComSpec" `
            -ArgumentList @("/c", "exit 0") `
            -WarmupRuns 1 `
            -MeasuredRuns 3 `
            -OutputDirectory "benchmark-results" `
            -WorkloadName "harness-smoke"
      - name: Upload smoke-test report
        uses: actions/upload-artifact@v4
        with:
          name: windows-benchmark-harness-smoke
          path: benchmark-results/
